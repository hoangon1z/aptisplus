services:
  db:
    image: postgres:17-alpine
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_DB: aptis
      POSTGRES_USER: aptis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U aptis]
      interval: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgres://aptis:${POSTGRES_PASSWORD}@db:5432/aptis
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      APP_ORIGIN: https://localhost:3443
      TRUST_PROXY: 'true'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    ports: ['127.0.0.1:3443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [app]
    restart: unless-stopped
volumes:
  postgres:
  caddy:
